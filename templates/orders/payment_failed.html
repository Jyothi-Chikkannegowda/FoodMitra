<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Failed - FoodMitra</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #fff8f0;
        font-family: "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      .navbar {
        background: #ff6b35;
        padding: 14px 32px;
        display: flex;
        align-items: center;
      }
      .nav-brand {
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        text-decoration: none;
      }
      .center {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 56px);
      }
      .card {
        background: #fff;
        border-radius: 20px;
        padding: 48px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(255, 107, 53, 0.1);
        max-width: 420px;
        animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .icon {
        font-size: 70px;
        margin-bottom: 20px;
        animation: shake 0.5s ease;
      }
      .title {
        font-size: 22px;
        font-weight: 700;
        color: #2c2c2a;
        margin-bottom: 10px;
      }
      .sub {
        font-size: 14px;
        color: #888;
        line-height: 1.7;
        margin-bottom: 28px;
      }
      .btn-retry {
        display: inline-block;
        padding: 12px 28px;
        background: #ff6b35;
        color: #fff;
        border-radius: 12px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        margin-right: 10px;
      }
      .btn-home {
        display: inline-block;
        padding: 12px 28px;
        background: #fff;
        color: #ff6b35;
        border: 1.5px solid #ff6b35;
        border-radius: 12px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-10px);
        }
        75% {
          transform: translateX(10px);
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a class="nav-brand" href="/">🍱 FoodMitra</a>
    </nav>
    <div class="center">
      <div class="card">
        <div class="icon">❌</div>
        <div class="title">Payment Failed!</div>
        <div class="sub">
          Something went wrong with your payment. Don't worry — no money was
          deducted. Please try again!
        </div>
        <a href="/menu/" class="btn-retry">Try Again 🔄</a>
        <a href="/" class="btn-home">Go Home</a>
      </div>
    </div>
  </body>
</html>
