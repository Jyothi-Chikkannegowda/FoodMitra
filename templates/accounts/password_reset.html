<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - FoodMitra</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(255,107,53,0.15); }
        .logo { font-size: 24px; font-weight: 900; color: #ff6b35; text-align: center; margin-bottom: 8px; }
        .title { font-size: 20px; font-weight: 800; color: #1a1a1a; text-align: center; margin-bottom: 6px; }
        .sub { font-size: 13px; color: #888; text-align: center; margin-bottom: 28px; }
        .field-group { margin-bottom: 16px; }
        .field-group label { font-size: 12px; font-weight: 600; color: #444; display: block; margin-bottom: 6px; }
        .field-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 14px; font-family: 'Poppins', sans-serif; outline: none; transition: border-color 0.2s; }
        .field-group input:focus { border-color: #ff6b35; }
        .submit-btn { width: 100%; padding: 13px; background: #ff6b35; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Poppins', sans-serif; transition: all 0.2s; }
        .submit-btn:hover { background: #e55a28; transform: translateY(-1px); }
        .back-link { text-align: center; margin-top: 16px; font-size: 13px; color: #888; }
        .back-link a { color: #ff6b35; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">🍱 FoodMitra</div>
    <div class="title">Forgot Password?</div>
    <div class="sub">Enter your email and we'll send you a reset link!</div>
    <form method="POST">
        {% csrf_token %}
        <div class="field-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your registered email" required>
        </div>
        <button type="submit" class="submit-btn">Send Reset Link 📧</button>
    </form>
    <div class="back-link">
        Remember your password? <a href="/accounts/login/">Login</a>
    </div>
</div>
</body>
</html>
