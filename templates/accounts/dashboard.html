<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard - FoodMitra</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #fff8f0;
        font-family: "Segoe UI", sans-serif;
      }
      .navbar {
        background: #ff6b35;
        padding: 14px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .nav-brand {
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        text-decoration: none;
      }
      .nav-logout {
        padding: 7px 20px;
        background: #fff;
        color: #ff6b35;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
      }
      .welcome {
        padding: 40px 32px;
        text-align: center;
      }
      .welcome h2 {
        color: #ff6b35;
        font-size: 28px;
        font-weight: 700;
      }
      .welcome p {
        color: #888;
        font-size: 15px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a class="nav-brand" href="/">🍱 FoodMitra</a>
      <a class="nav-logout" href="/accounts/logout/">Logout</a>
    </nav>
    <div class="welcome">
      <h2>Welcome, {{ request.user.username }}! 🎉</h2>
      <p>You are successfully logged in to FoodMitra</p>
      <p style="margin-top: 20px; color: #ff6b35">Dashboard coming soon...</p>
    </div>
  </body>
</html>
