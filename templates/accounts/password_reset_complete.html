<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Done - FoodMitra</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(255,107,53,0.15); text-align: center; }
        .icon { font-size: 60px; margin-bottom: 16px; }
        .title { font-size: 20px; font-weight: 800; color: #1a1a1a; margin-bottom: 8px; }
        .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
        .login-btn { display: inline-block; padding: 12px 28px; background: #ff6b35; color: #fff; border-radius: 10px; font-size: 14px; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🎉</div>
    <div class="title">Password Reset Successful!</div>
    <div class="sub">Your password has been reset successfully. You can now login with your new password!</div>
    <a href="/accounts/login/" class="login-btn">Login Now →</a>
</div>
</body>
</html>
